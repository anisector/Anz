name: Build Anizium CloudStream plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build plugin
        run: gradle :Anz:make --stacktrace

      - name: Locate CS3
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find . -path './builds/Anizium.cs3' -prune -o -type f -name '*.cs3' -print -quit)
          if [ -z "$FILE" ]; then
            echo 'No .cs3 file produced.'
            find . -maxdepth 5 -type f | sort | head -300
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Built: $FILE"

      - name: Publish test repo files
        shell: bash
        env:
          CS3: ${{ steps.locate.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p builds
          if [ "$CS3" != "./builds/Anizium.cs3" ]; then
            cp "$CS3" builds/Anizium.cs3
          fi
          python3 - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path('builds/Anizium.cs3')
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          item = {
              'url': 'https://raw.githubusercontent.com/anisector/anz/main/builds/Anizium.cs3',
              'status': 1,
              'version': 28,
              'name': 'Anizium',
              'internalName': 'Anizium',
              'authors': ['kerimmkirac', 'ByAyzen', 'anisector'],
              'description': 'Anizium current API CloudStream provider test build.',
              'fileSize': p.stat().st_size,
              'repositoryUrl': 'https://github.com/anisector/anz',
              'language': 'tr',
              'tvTypes': ['AnimeMovie', 'Anime'],
              'iconUrl': 'https://anizium.co/assets/images/logo.png',
              'apiVersion': 1,
              'fileHash': 'sha256-' + h,
          }
          pathlib.Path('builds/plugins.json').write_text(json.dumps([item], ensure_ascii=False, indent=2) + '\n')
          print('SHA256:', h)
          print('SIZE:', p.stat().st_size)
          PY

      - name: Commit built plugin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/Anizium.cs3 builds/plugins.json
          if git diff --cached --quiet; then
            echo 'No build output changes to commit.'
            exit 0
          fi
          git commit -m 'Build Anizium CloudStream plugin'
          git push
