name: Build Anizium CloudStream plugin


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'


      - name: Build plugin
        run: gradle :Anz:make --stacktrace


      - name: Locate CS3
        id: locate
        shell: bash
