name: Build Anizium CloudStream plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build plugin
        run: gradle :Anz:make --stacktrace

      - name: Prepare build output
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find . -path './.git' -prune -o -type f -name '*.cs3' -print | head -1)
          if [ -z "$FILE" ]; then
            echo 'No .cs3 file produced.'
            exit 1
          fi
          cp "$FILE" /tmp/Anizium.cs3
          python3 - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path('/tmp/Anizium.cs3')
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          item = {
              'url': 'https://raw.githubusercontent.com/anisector/Anz/builds/Anizium.cs3',
              'status': 1,
              'version': 28,
              'name': 'Anizium',
              'internalName': 'Anizium',
              'authors': ['kerimmkirac', 'ByAyzen', 'anisector'],
              'description': 'Anizium current API CloudStream provider.',
              'fileSize': p.stat().st_size,
              'repositoryUrl': 'https://github.com/anisector/Anz',
              'language': 'tr',
              'tvTypes': ['AnimeMovie', 'Anime'],
              'iconUrl': 'https://anizium.co/assets/images/logo.png',
              'apiVersion': 1,
              'fileHash': 'sha256-' + h,
          }
          pathlib.Path('/tmp/plugins.json').write_text(json.dumps([item], ensure_ascii=False, indent=2) + '\n')
          PY
          cat > /tmp/repo.json <<'JSON'
          {
            "name": "Anizium Test Repo | anisector",
            "description": "Anizium CloudStream provider test repository",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/anisector/Anz/builds/plugins.json"
            ]
          }
          JSON

      - name: Publish builds branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin builds
          git checkout -B builds origin/builds
          git rm -r -f . || true
          cp /tmp/Anizium.cs3 ./Anizium.cs3
          cp /tmp/plugins.json ./plugins.json
          cp /tmp/repo.json ./repo.json
          git add -A
          git commit -m 'Publish Anizium CloudStream build'
          git push origin builds --force
